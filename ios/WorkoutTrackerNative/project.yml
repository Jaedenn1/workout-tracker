name: WorkoutTrackerNative
options:
  bundleIdPrefix: com.jaedenn
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  WorkoutTrackerNative:
    type: application
    platform: iOS
    sources:
      - path: WorkoutTrackerNative
      - path: Shared
      - path: ActivityShared
    info:
      path: WorkoutTrackerNative/Info.plist
    entitlements:
      path: WorkoutTrackerNative/WorkoutTrackerNative.entitlements
    dependencies:
      - target: WorkoutLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaedenn.workouttracker
        PRODUCT_NAME: Workout
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1"

  WorkoutLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: WorkoutLiveActivity
      - path: ActivityShared
    info:
      path: WorkoutLiveActivity/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaedenn.workouttracker.liveactivity
        PRODUCT_NAME: WorkoutLiveActivity
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "9"
        APPLICATION_EXTENSION_API_ONLY: YES

  WorkoutTrackerWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: WorkoutTrackerWatchApp
      - path: Shared
    info:
      path: WorkoutTrackerWatchApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaedenn.workouttracker.watchapp
        PRODUCT_NAME: Workout Watch
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "9"

schemes:
  WorkoutTrackerNative:
    build:
      targets:
        WorkoutTrackerNative: all
    run:
      config: Debug
    archive:
      config: Release
  WorkoutTrackerWatchApp:
    build:
      targets:
        WorkoutTrackerWatchApp: all
    run:
      config: Debug
  WorkoutLiveActivity:
    build:
      targets:
        WorkoutLiveActivity: all
