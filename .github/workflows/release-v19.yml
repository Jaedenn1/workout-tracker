name: Release v1.9 Live Training OS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v19.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.9 Live Training OS patch
        run: python scripts/apply_v19.py
      - name: Install locked dependencies
        run: npm ci
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff sanity check
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.0"
          test -f app/live/page.tsx
          test -f src/components/LiveTrainingOS.tsx
          test -f src/lib/liveTraining.ts
          grep -q 'workout-tracker-v1.9-live-training-os' public/sw.js
          grep -q '"/live"' public/sw.js
          grep -q 'workout-tracker:v1.9:live-session' src/lib/database.ts
          grep -q 'Live Training OS' src/components/TodayDashboard.tsx
          grep -q 'LIVE TRAINING OS · V1.9' src/components/LiveTrainingOS.tsx
          git diff --check
      - name: Commit verified v1.9
        run: |
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git add app src public package.json package-lock.json
          git rm -f scripts/apply_v19.py .github/workflows/release-v19.yml
          git commit -m "Release v1.9 Live Training OS"
          git push
