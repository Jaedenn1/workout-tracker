name: Package v1.9.1 deploy source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-v191-deploy.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.9.1 source
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.1"
          grep -q 'workout-tracker-v1.9.1-live-reliability' public/sw.js
          grep -q 'LIVE TRAINING OS · V1.9.1' src/components/LiveTrainingOS.tsx
      - name: Build deployment source archive
        run: |
          zip -qr workout-tracker-v191-source.zip app src public scripts/live-reliability.test.cjs package.json package-lock.json tsconfig.json next-env.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-v191-source
          path: workout-tracker-v191-source.zip
          retention-days: 1
