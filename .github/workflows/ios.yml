name: iOS + watchOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/WorkoutTrackerNative
        run: xcodegen generate
      - name: Build iPhone app + Live Activity
        working-directory: ios/WorkoutTrackerNative
        run: |
          xcodebuild \
            -project WorkoutTrackerNative.xcodeproj \
            -scheme WorkoutTrackerNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build Apple Watch app
        working-directory: ios/WorkoutTrackerNative
        run: |
          xcodebuild \
            -project WorkoutTrackerNative.xcodeproj \
            -scheme WorkoutTrackerWatchApp \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
