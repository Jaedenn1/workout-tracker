name: Web build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
