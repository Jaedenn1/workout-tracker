name: Guarded dependency lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lock-dependencies.yml"

permissions:
  contents: write

jobs:
  lock-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Install exactly from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git add package-lock.json
          git commit -m "Lock web dependencies"
          git push
