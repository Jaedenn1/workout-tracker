name: Package v1.6 deploy source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-v16-deploy.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment source archive
        run: |
          zip -r workout-tracker-v16-source.zip app src public package.json package-lock.json tsconfig.json next-env.d.ts \
            -x '*.DS_Store'
      - name: Upload deployment source
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-v16-source
          path: workout-tracker-v16-source.zip
          if-no-files-found: error
          retention-days: 1
