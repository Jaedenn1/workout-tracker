name: One-shot session fix v3

on:
  push:
    paths:
      - '.github/workflows/oneshot-session-fix-v3.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch session state at source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          p = Path('src/components/FirstWorkoutGymLogger.tsx')
          s = p.read_text()

          def rep(old, new, count=1, label='source block'):
              global s
              actual = s.count(old)
              if actual < count:
                  raise SystemExit(f'Missing expected {label} (needed {count}, found {actual}):\n' + old[:300])
              s = s.replace(old, new, count)

          rep('''type SessionDraft = {
  exercises: GymExercise[];
  startedAt: string;
  pausedAt?: string | null;''', '''type SessionDraft = {
  exercises: GymExercise[];
  startedAt: string | null;
  sessionActive?: boolean;
  pausedAt?: string | null;''', label='SessionDraft')

          rep('''function elapsedSeconds(startedAt: string, pausedSeconds: number, pausedAt: string | null) {
  const start = new Date(startedAt).getTime();''', '''function elapsedSeconds(startedAt: string | null, pausedSeconds: number, pausedAt: string | null) {
  if (!startedAt) return 0;
  const start = new Date(startedAt).getTime();''', label='elapsedSeconds')

          marker = 'function previousLabel(previous?: PreviousSet) {'
          helper = '''function draftHasMeaningfulActivity(draft: Partial<SessionDraft>) {
  return Boolean(
    draft.exercises?.some((exercise) =>
      exercise.sets?.some((set) => set.completed || set.reps != null || set.rir != null),
    ),
  );
}

function draftSessionIsActive(draft: Partial<SessionDraft>) {
  const declaredActive = draft.sessionActive ?? draftHasMeaningfulActivity(draft);
  if (!declaredActive || !draft.startedAt) return false;
  const started = new Date(draft.startedAt).getTime();
  const age = Date.now() - started;
  return Number.isFinite(started) && age >= 0 && age <= 6 * 60 * 60 * 1000;
}

''' + marker
          rep(marker, helper, label='draft helper insertion')

          rep('''  const [startedAt, setStartedAt] = useState(() => new Date().toISOString());
  const [pausedAt, setPausedAt] = useState<string | null>(null);''', '''  const [startedAt, setStartedAt] = useState<string | null>(null);
  const [sessionActive, setSessionActive] = useState(false);
  const [pausedAt, setPausedAt] = useState<string | null>(null);''', label='session state')

          rep('''  const [finishOpen, setFinishOpen] = useState(false);
  const [finishHolding, setFinishHolding] = useState(false);''', '''  const [finishOpen, setFinishOpen] = useState(false);
  const [finishHolding, setFinishHolding] = useState(false);
  const [cancelArmed, setCancelArmed] = useState(false);''', label='cancel state')

          rep('''      setStartedAt(draft.startedAt ?? new Date().toISOString());
      if ("pausedAt" in draft) setPausedAt(draft.pausedAt ?? null);
      if ("totalPausedSeconds" in draft) setTotalPausedSeconds(Number(draft.totalPausedSeconds ?? 0));
      if ("restRemaining" in draft) setRestRemaining(Number(draft.restRemaining ?? 0));''', '''      const activeDraft = draftSessionIsActive(draft as SessionDraft);
      setSessionActive(activeDraft);
      setStartedAt(activeDraft ? (draft.startedAt ?? null) : null);
      setPausedAt(activeDraft && "pausedAt" in draft ? (draft.pausedAt ?? null) : null);
      setTotalPausedSeconds(activeDraft && "totalPausedSeconds" in draft ? Number(draft.totalPausedSeconds ?? 0) : 0);
      setRestRemaining(activeDraft && "restRemaining" in draft ? Number(draft.restRemaining ?? 0) : 0);''', label='hydrate active draft')

          rep('''    } else {
      loaded = makeRoutine(target, parsedHistory, parsedCustom, parsedNotes, parsedRests, parsedExtras);
      setExercises(loaded);
      setCollapsed(defaultCollapsed(loaded));
    }
    setExercises(loaded);''', '''    } else {
      loaded = makeRoutine(target, parsedHistory, parsedCustom, parsedNotes, parsedRests, parsedExtras);
      setSessionActive(false);
      setStartedAt(null);
      setPausedAt(null);
      setTotalPausedSeconds(0);
      setRestRemaining(0);
      setElapsed(0);
      setExercises(loaded);
      setCollapsed(defaultCollapsed(loaded));
    }
    setExercises(loaded);''', label='hydrate fresh routine')

          # Persist explicit active/inactive state in both draft object writes.
          draft_pattern = re.compile(r'(\n\s*exercises,\n\s*startedAt,\n)(\s*pausedAt,)')
          s, draft_count = draft_pattern.subn(r'\1      sessionActive,\n\2', s)
          if draft_count < 2:
              raise SystemExit(f'Expected at least 2 persisted draft objects, found {draft_count}')

          # Exact autosave dependency shape from current source.
          rep('''  }, [
    exercises,
    startedAt,
    pausedAt,''', '''  }, [
    exercises,
    startedAt,
    sessionActive,
    pausedAt,''', label='autosave dependencies')

          rep('''  useEffect(() => {
    if (!hydrated) return;
    const tick = () => setElapsed(elapsedSeconds(startedAt, totalPausedSeconds, pausedAt));
    tick();
    const timer = window.setInterval(tick, 1000);
    return () => window.clearInterval(timer);
  }, [hydrated, startedAt, totalPausedSeconds, pausedAt]);''', '''  useEffect(() => {
    if (!hydrated || !sessionActive || !startedAt) {
      setElapsed(0);
      return;
    }
    const tick = () => setElapsed(elapsedSeconds(startedAt, totalPausedSeconds, pausedAt));
    tick();
    const timer = window.setInterval(tick, 1000);
    return () => window.clearInterval(timer);
  }, [hydrated, sessionActive, startedAt, totalPausedSeconds, pausedAt]);''', label='workout timer effect')

          rep('''  useEffect(() => {
    if (restRemaining <= 0 || pausedAt) return;''', '''  useEffect(() => {
    if (!sessionActive || restRemaining <= 0 || pausedAt) return;''', label='rest timer guard')
          rep('''  }, [restRemaining, pausedAt]);''', '''  }, [sessionActive, restRemaining, pausedAt]);''', label='rest timer dependencies')

          rep('''      if (pausedAt || document.visibilityState !== "visible" || !nav.wakeLock?.request || wakeLockRef.current) return;''', '''      if (!sessionActive || pausedAt || document.visibilityState !== "visible" || !nav.wakeLock?.request || wakeLockRef.current) return;''', label='wake lock guard')
          rep('''    void (pausedAt ? release() : acquire());
    const onVisibility = () => void (document.visibilityState === "visible" && !pausedAt ? acquire() : release());''', '''    void (!sessionActive || pausedAt ? release() : acquire());
    const onVisibility = () => void (document.visibilityState === "visible" && sessionActive && !pausedAt ? acquire() : release());''', label='wake lock activation')
          rep('''  }, [hydrated, pausedAt]);''', '''  }, [hydrated, sessionActive, pausedAt]);''', label='wake lock dependencies')

          rep('''      setStartedAt(draft.startedAt);
      setPausedAt(draft.pausedAt ?? null);
      setTotalPausedSeconds(Number(draft.totalPausedSeconds ?? 0));
      setRestRemaining(Number(draft.restRemaining ?? 0));''', '''      const activeDraft = draftSessionIsActive(draft);
      setSessionActive(activeDraft);
      setStartedAt(activeDraft ? draft.startedAt : null);
      setPausedAt(activeDraft ? (draft.pausedAt ?? null) : null);
      setTotalPausedSeconds(activeDraft ? Number(draft.totalPausedSeconds ?? 0) : 0);
      setRestRemaining(activeDraft ? Number(draft.restRemaining ?? 0) : 0);''', label='routine switch draft')

          rep('''      setStartedAt(new Date().toISOString());
      setPausedAt(null);
      setTotalPausedSeconds(0);
      setRestRemaining(0);
      setSessionNote("");''', '''      setSessionActive(false);
      setStartedAt(null);
      setElapsed(0);
      setPausedAt(null);
      setTotalPausedSeconds(0);
      setRestRemaining(0);
      setSessionNote("");''', label='routine switch fresh')

          rep('''    setNotice(draft ? `Resumed saved ${target.name} session.` : `Started ${target.name}.`);
  }

  function togglePause() {''', '''    const activeDraft = draft ? draftSessionIsActive(draft) : false;
    setNotice(activeDraft ? `Resumed saved ${target.name} session.` : `${target.name} ready. Timer starts when you start logging.`);
  }

  function startWorkout() {
    if (sessionActive) return;
    setSessionActive(true);
    setStartedAt(new Date().toISOString());
    setElapsed(0);
    setPausedAt(null);
    setTotalPausedSeconds(0);
    setNotice("Workout started. Timer is running.");
  }

  function ensureSessionStarted() {
    if (!sessionActive) startWorkout();
  }

  function togglePause() {
    if (!sessionActive) {
      setNotice("No workout is running yet. Tap Start or log your first set.");
      return;
    }''', label='start and pause functions')

          rep('''  function updateSet(exerciseId: string, setId: string, field: "weight" | "reps" | "rir", raw: string) {
    const value = raw === "" ? null : Number(raw);''', '''  function updateSet(exerciseId: string, setId: string, field: "weight" | "reps" | "rir", raw: string) {
    if (raw !== "") ensureSessionStarted();
    const value = raw === "" ? null : Number(raw);''', label='set input auto-start')

          rep('''  function copyPrevious(exerciseId: string, setId: string, index: number) {
    setExercises''', '''  function copyPrevious(exerciseId: string, setId: string, index: number) {
    ensureSessionStarted();
    setExercises''', label='copy previous auto-start')

          rep('''    const completing = !target.completed;
    let shouldRest = completing;''', '''    const completing = !target.completed;
    if (completing) ensureSessionStarted();
    let shouldRest = completing;''', label='complete set auto-start')

          cancel_marker = '  function finishWorkout() {'
          cancel_fn = '''  function cancelWorkout() {
    if (!sessionActive) {
      setNotice("No workout is currently running.");
      setCancelArmed(false);
      return;
    }
    if (!cancelArmed) {
      setCancelArmed(true);
      setNotice("Tap Cancel workout again within 5 seconds to discard this session.");
      window.setTimeout(() => setCancelArmed(false), 5000);
      return;
    }

    const drafts = readJson<DraftMap>(DRAFTS_KEY, {});
    delete drafts[activeRoutine.id];
    localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));
    const legacyDrafts = readJson<Record<string, unknown>>(LEGACY_DRAFTS_KEY, {});
    delete legacyDrafts[activeRoutine.id];
    localStorage.setItem(LEGACY_DRAFTS_KEY, JSON.stringify(legacyDrafts));

    const fresh = makeRoutine(activeRoutine, history, customExercises, notes, rests, extras);
    setExercises(fresh);
    setSessionActive(false);
    setStartedAt(null);
    setElapsed(0);
    setPausedAt(null);
    setTotalPausedSeconds(0);
    setRestRemaining(0);
    setSessionNote("");
    setCollapsed(defaultCollapsed(fresh));
    setEditingCompleted({});
    setFinishOpen(false);
    setCancelArmed(false);
    setSavedAt(null);
    setNotice("Workout canceled. Nothing was saved to History.");
  }

''' + cancel_marker
          rep(cancel_marker, cancel_fn, label='cancel function insertion')

          rep('''    setHistory(nextHistory);
    setExercises(nextExercises);
    setStartedAt(new Date().toISOString());
    setPausedAt(null);''', '''    setHistory(nextHistory);
    setExercises(nextExercises);
    setSessionActive(false);
    setStartedAt(null);
    setElapsed(0);
    setPausedAt(null);''', label='post-finish reset')

          old_header = '''        <div className="gym-v12-session">
          <span>{pausedAt ? "PAUSED" : "SESSION"}</span>
          <strong>{formatDuration(elapsed)}</strong>
          <small>{savedAt ? "Saved locally ✓" : "Local-first"}{wakeLockActive ? " · screen awake" : ""}</small>
          <button className={pausedAt ? "resume" : "pause"} onClick={togglePause}>{pausedAt ? "▶ Resume" : "Ⅱ Pause"}</button>
        </div>'''
          new_header = '''        <div className="gym-v12-session">
          <span>{!sessionActive ? "READY" : pausedAt ? "PAUSED" : "SESSION"}</span>
          <strong>{sessionActive ? formatDuration(elapsed) : "0:00"}</strong>
          <small>{!sessionActive ? "Timer starts with Start or your first logged set" : `${savedAt ? "Saved locally ✓" : "Local-first"}${wakeLockActive ? " · screen awake" : ""}`}</small>
          <div className="gym-session-actions">
            {!sessionActive ? (
              <button className="resume" onClick={startWorkout}>▶ Start workout</button>
            ) : (
              <button className={pausedAt ? "resume" : "pause"} onClick={togglePause}>{pausedAt ? "▶ Resume" : "Ⅱ Pause"}</button>
            )}
            <details className="gym-session-menu">
              <summary>Session menu <span>⌄</span></summary>
              <div>
                <strong>Session controls</strong>
                {sessionActive ? (
                  <>
                    <p>Canceling discards this in-progress workout and does not save it to History.</p>
                    <button className={`danger ${cancelArmed ? "armed" : ""}`} onClick={cancelWorkout}>
                      {cancelArmed ? "Tap again to discard" : "Cancel workout"}
                    </button>
                  </>
                ) : (
                  <p>No workout is running. Start when you are ready.</p>
                )}
              </div>
            </details>
          </div>
        </div>'''
          rep(old_header, new_header, label='session header')
          rep('{pausedAt && (', '{sessionActive && pausedAt && (', label='pause banner guard')
          rep('''<main className={`gym-shell gym-v12 ${pausedAt ? "session-paused" : ""}`}>''', '''<main className={`gym-shell gym-v12 ${sessionActive && pausedAt ? "session-paused" : ""}`}>''', label='paused shell class')

          p.write_text(s)

          Path('app/gym/page.tsx').write_text('''import FirstWorkoutGymLogger from "../../src/components/FirstWorkoutGymLogger";\n\nexport default function GymPage() {\n  return <FirstWorkoutGymLogger />;\n}\n''')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['version'] = '1.2.2'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          sw = Path('public/sw.js')
          sw_text = sw.read_text()
          sw_text, count = re.subn(r'const CACHE = "workout-tracker-v[^"]+";', 'const CACHE = "workout-tracker-v1.2.2";', sw_text, count=1)
          if count != 1:
              raise SystemExit('Could not bump service worker cache key')
          sw.write_text(sw_text)

          css = Path('app/v17.css')
          css_text = css.read_text()
          if 'v1.2.2 — explicit workout session state' not in css_text:
              css_text += r'''

/* v1.2.2 — explicit workout session state */
.gym-session-actions { display: grid; gap: 8px; width: 100%; }
.gym-session-menu { position: relative; width: 100%; }
.gym-session-menu > summary { list-style: none; cursor: pointer; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 750; background: rgba(255,255,255,.035); }
.gym-session-menu > summary::-webkit-details-marker { display: none; }
.gym-session-menu[open] > summary { border-color: rgba(255,255,255,.2); }
.gym-session-menu > div { margin-top: 8px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 12px; background: #111; box-shadow: 0 16px 40px rgba(0,0,0,.35); text-align: left; }
.gym-session-menu p { margin: 6px 0 10px; font-size: 11px; line-height: 1.4; opacity: .72; }
.gym-session-menu button.danger { width: 100%; border: 1px solid rgba(255,88,88,.3); background: rgba(255,70,70,.1); color: #ff9a9a; border-radius: 10px; padding: 10px; font-weight: 800; }
.gym-session-menu button.danger.armed { background: rgba(255,70,70,.24); color: #fff; }
'''
          css.write_text(css_text)
          PY

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git rm .github/workflows/oneshot-session-fix.yml .github/workflows/oneshot-session-fix-v2.yml .github/workflows/oneshot-session-fix-v3.yml src/components/CancelWorkoutControl.tsx
          git add src/components/FirstWorkoutGymLogger.tsx app/gym/page.tsx app/v17.css package.json public/sw.js
          git commit -m "Fix workout timer and cancel session state"
          git push origin HEAD:main
