name: Package v1.9 deploy source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-v19-deploy.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.9 source
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.0"
          test -f app/live/page.tsx
          test -f src/components/LiveTrainingOS.tsx
          grep -q 'workout-tracker-v1.9-live-training-os' public/sw.js
      - name: Build deployment source archive
        run: |
          zip -r workout-tracker-v19-source.zip app src public package.json package-lock.json tsconfig.json next-env.d.ts -x '*.DS_Store'
      - name: Upload deployment source
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-v19-source
          path: workout-tracker-v19-source.zip
          if-no-files-found: error
          retention-days: 1
