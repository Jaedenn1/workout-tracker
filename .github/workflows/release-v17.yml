name: Release v1.7 Adaptive Intelligence

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_v17.py"
      - ".github/workflows/release-v17.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.7 adaptive intelligence patch
        run: python3 scripts/apply_v17.py
      - name: Install locked dependencies
        run: npm ci
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff sanity check
        run: git diff --check
      - name: Commit verified v1.7
        run: |
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git add src/lib/adaptiveTraining.ts src/components/AdaptiveCoach.tsx app/coach/page.tsx app/v22.css app/layout.tsx src/components/TodayDashboard.tsx src/components/WeeklyPlan.tsx public/sw.js package.json package-lock.json src/lib/database.ts
          git rm .github/workflows/release-v17.yml scripts/apply_v17.py
          git commit -m "Release v1.7 Adaptive Weekly Intelligence"
          git push
