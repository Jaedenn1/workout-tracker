name: Guarded Vercel production deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vercel-once.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_EpENX23a7bdDTsSbwWF0AhGP
      VERCEL_PROJECT_ID: prj_x3ra0fvZghSoocTV3wsjt8DNrw45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check deployment credential
        id: credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_NOT_CONFIGURED"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN_CONFIGURED"
          fi
      - name: Pull production environment
        if: steps.credential.outputs.available == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production bundle
        if: steps.credential.outputs.available == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production bundle
        if: steps.credential.outputs.available == 'true'
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
