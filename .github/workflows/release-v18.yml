name: Release v1.8 Advanced Intelligence

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_v18_release.py"
      - ".github/workflows/release-v18.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.8 release metadata
        run: python3 scripts/apply_v18_release.py
      - name: Install locked dependencies
        run: npm ci
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff sanity check
        run: git diff --check
      - name: Commit verified v1.8
        run: |
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git add src/lib/advancedTrainingIntelligence.ts src/components/AdaptiveCoach.tsx src/lib/database.ts app/layout.tsx app/v23.css public/sw.js package.json package-lock.json
          git rm .github/workflows/release-v18.yml scripts/apply_v18_release.py
          git commit -m "Release v1.8 advanced intelligence layer"
          git push
