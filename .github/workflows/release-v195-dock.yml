name: Release v1.9.5 Bottom Dock Stability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v195-dock.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finalize v1.9.5 metadata
        run: |
          npm version 1.9.5 --no-git-tag-version
          sed -i 's/workout-tracker-v1.9.4-exercise-bank/workout-tracker-v1.9.5-bottom-dock-stability/' public/sw.js
          sed -i 's/TODAY · V1.9.4/TODAY · V1.9.5/g' src/components/TodayDashboard.tsx
          sed -i 's/LIVE TRAINING OS · V1.9.4/LIVE TRAINING OS · V1.9.5/g' src/components/LiveTrainingOS.tsx
      - name: Install locked dependencies
        run: npm ci
      - name: Service worker syntax
        run: node --check public/sw.js
      - name: Typecheck
        run: npm run typecheck
      - name: Live Training reliability checks
        run: npm run test:live
      - name: Production build
        run: npm run build
      - name: Dock stability sanity
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.5"
          grep -q 'workout-tracker-v1.9.5-bottom-dock-stability' public/sw.js
          grep -q 'v27.css' app/layout.tsx
          grep -q 'position: fixed !important' app/v27.css
          grep -q 'transform: none !important' app/v27.css
          grep -q 'backdrop-filter: none !important' app/v27.css
          git diff --check
      - name: Commit verified v1.9.5 metadata
        run: |
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git add package.json package-lock.json public/sw.js src/components/TodayDashboard.tsx src/components/LiveTrainingOS.tsx
          git commit -m "Release v1.9.5 bottom dock stability"
          git push
