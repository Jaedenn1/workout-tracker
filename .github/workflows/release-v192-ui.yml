name: Release v1.9.2 UI Polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v192-ui.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finalize v1.9.2 metadata
        run: |
          npm version 1.9.2 --no-git-tag-version
          sed -i 's/workout-tracker-v1.9.1-live-reliability/workout-tracker-v1.9.2-ui-polish/' public/sw.js
          sed -i 's/LIVE TRAINING OS · V1.9.1/LIVE TRAINING OS · V1.9.2/g' src/components/LiveTrainingOS.tsx
      - name: Install locked dependencies
        run: npm ci
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Typecheck
        run: npm run typecheck
      - name: Live Training reliability checks
        run: npm run test:live
      - name: Production build
        run: npm run build
      - name: UI release sanity
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.2"
          grep -q 'workout-tracker-v1.9.2-ui-polish' public/sw.js
          grep -q 'LIVE TRAINING OS · V1.9.2' src/components/LiveTrainingOS.tsx
          grep -q 'ti-home-v192' src/components/TodayDashboard.tsx
          grep -q 'v25.css' app/layout.tsx
          git diff --check
      - name: Commit verified v1.9.2 metadata
        run: |
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git add package.json package-lock.json public/sw.js src/components/LiveTrainingOS.tsx
          git commit -m "Release v1.9.2 UI polish"
          git push
