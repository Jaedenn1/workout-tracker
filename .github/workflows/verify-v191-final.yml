name: Verify and release v1.9.1 final

on:
  push:
    branches:
      - release/v1.9.1-reliability-final
    paths:
      - ".github/workflows/verify-v191-final.yml"

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and verify patch
        run: |
          cat scripts/v191-final/chunk-*.txt > /tmp/v191-final.b64
          base64 -d /tmp/v191-final.b64 > /tmp/v191-final.patch.gz
          gzip -dc /tmp/v191-final.patch.gz > /tmp/v191-final.patch
          echo "5aeeb97f6186b1df74f9aeeca0d20877ac7a1759ff134d449ba821f6c17cff6c  /tmp/v191-final.patch" | sha256sum -c -
          git apply --check /tmp/v191-final.patch
          git apply /tmp/v191-final.patch
          sed -i 's/tsc --rootDir src/tsc --ignoreConfig --rootDir src/' package.json
          sed -i 's/--module commonjs --moduleResolution node/--module node16 --moduleResolution node16/' package.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Typecheck
        run: npm run typecheck
      - name: Live Training reliability checks
        run: npm run test:live
      - name: Production build
        run: npm run build
      - name: Diff sanity check
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.1"
          grep -q 'workout-tracker-v1.9.1-live-reliability' public/sw.js
          grep -q 'LIVE TRAINING OS · V1.9.1' src/components/LiveTrainingOS.tsx
          grep -q 'test:live' package.json
          grep -q -- '--ignoreConfig' package.json
          grep -q -- '--moduleResolution node16' package.json
          grep -q 'Live Training reliability checks' .github/workflows/web.yml
          git diff --check
      - name: Commit verified clean release
        run: |
          git config user.name "Jaedenn1"
          git config user.email "Jaedennm@gmail.com"
          git add app src public package.json package-lock.json scripts/live-reliability.test.cjs .github/workflows/web.yml
          git rm -f scripts/v191.patch.gz.b64 .github/workflows/release-v191.yml
          git rm -rf scripts/v191-final .github/workflows/verify-v191-final.yml
          git commit -m "Release v1.9.1 Live Training reliability"
          git push origin HEAD:release/v1.9.1-reliability-final
# rerun with regression file present
