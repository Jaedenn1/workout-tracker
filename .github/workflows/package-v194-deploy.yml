name: Package v1.9.4 deploy source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-v194-deploy.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.9.4 source
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.4"
          grep -q 'workout-tracker-v1.9.4-exercise-bank' public/sw.js
          grep -q 'trap-bar-deadlift' src/data/training.ts
          grep -q 'cable-crunch' src/data/training.ts
      - name: Build deployment source archive
        run: |
          zip -qr workout-tracker-v194-source.zip app src public scripts/live-reliability.test.cjs package.json package-lock.json tsconfig.json next-env.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-v194-source
          path: workout-tracker-v194-source.zip
          retention-days: 1
