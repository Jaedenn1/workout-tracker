name: Package v1.9.5 deploy source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-v195-deploy.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.9.5 source
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.5"
          grep -q 'workout-tracker-v1.9.5-bottom-dock-stability' public/sw.js
          grep -q 'v27.css' app/layout.tsx
          grep -q 'transform: none !important' app/v27.css
      - name: Build deployment source archive
        run: |
          zip -qr workout-tracker-v195-source.zip app src public scripts/live-reliability.test.cjs package.json package-lock.json tsconfig.json next-env.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-v195-source
          path: workout-tracker-v195-source.zip
          retention-days: 1
